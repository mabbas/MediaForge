[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grabitdown"
version = "0.1.0"
description = "GrabItDown — Production-grade media downloader platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "click>=8.0",
  "rich>=13.0",
  "yt-dlp>=2025.12.0",
  "indic-transliteration>=2.3.0",
  "unidecode>=1.3.0",
  # API & server (websockets required for /api/v1/ws/progress)
  "uvicorn[standard]>=0.30.0",
  "websockets>=14.0",
  "fastapi>=0.115.0",
  # Database
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  # Auth & Security & Rate Limiting
  "argon2-cffi>=23.1.0",
  "pyjwt[crypto]>=2.8.0",
  "redis>=5.0.0",
  # Config
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Native desktop window. On Windows, pywebview needs pythonnet which may fail to build;
# use browser fallback (python -m desktop) or install a pre-built pythonnet wheel.
desktop = [
  "pywebview>=4.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27.0",
  "ruff>=0.3.0",
  "mypy>=1.8",
]

[project.scripts]
gid = "src.cli.cli:main"
grabitdown = "src.cli.cli:main"

[tool.pytest.ini_options]
markers = [
  "integration: tests requiring network access",
]
testpaths = ["tests"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["src", "api"]

