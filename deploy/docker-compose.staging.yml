name: mediaforge-staging

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: mediaforge-staging-caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAGING_HTTPS_PORT:-8443}:443"
      - "127.0.0.1:${STAGING_HTTP_PORT:-8088}:80"
      - "127.0.0.1:${STAGING_UPSTREAM_HTTP_PORT:-8089}:8089"
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:-staging.mediaforge.local}
      ALLOWED_CIDRS: ${STAGING_ALLOWED_CIDRS:-127.0.0.1/32 ::1 100.64.0.0/10}
    volumes:
      - ./staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - staging_caddy_data:/data
      - staging_caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - staging_net

  web:
    image: mediaforge-staging-web:latest
    container_name: mediaforge-staging-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:8000/api/v1
      BACKEND_INTERNAL_URL: http://api:8000/api/v1
      NEXT_PUBLIC_API_URL: http://api:8000/api/v1
      CSRF_SECRET_KEY: ${CSRF_SECRET_KEY:?CSRF secret key is required}
      AUTH_SECRET_KEY: ${GID_JWT_SECRET_KEY:?JWT secret key is required}
      AUTH_INTERNAL_SECRET: ${GID_JWT_SECRET_KEY:?JWT secret key is required}
      ALLOWED_ORIGINS: ${STAGING_ALLOWED_ORIGINS:-https://staging.mediaforge.local:8443,https://localhost:8443,https://127.0.0.1:8443,https://staging.mediaforge.local,http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/admin/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - staging_net

  api:
    image: mediaforge-staging-api:latest
    container_name: mediaforge-staging-api
    restart: unless-stopped
    environment:
      GID_API_DATABASE_URL: postgresql+asyncpg://${GID_APP_USER:-gid_app}:${GID_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-grabitdown_staging}
      GID_API_HOST: "0.0.0.0"
      GID_API_PORT: 8000
      GID_JWT_SECRET_KEY: ${GID_JWT_SECRET_KEY:?JWT secret key is required}
      GID_DOWNLOAD__OUTPUT_DIRECTORY: "/app/downloads"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
    volumes:
      - staging_api_data:/app/data
      - staging_media_data:/app/downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - staging_net

  worker:
    image: mediaforge-staging-api:latest
    container_name: mediaforge-staging-worker
    restart: unless-stopped
    command: ["python", "-m", "api.workers.media_worker"]
    environment:
      GID_API_DATABASE_URL: postgresql+asyncpg://${GID_APP_USER:-gid_app}:${GID_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-grabitdown_staging}
      GID_DOWNLOAD__OUTPUT_DIRECTORY: "/app/downloads"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
    volumes:
      - staging_api_data:/app/data
      - staging_media_data:/app/downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, time; assert time.time() - os.path.getmtime('/tmp/worker_heartbeat') < 60\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - staging_net

  postgres:
    image: postgres:16-alpine
    container_name: mediaforge-staging-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAGING_POSTGRES_PORT:-55433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grabitdown_staging}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database superuser password required}
      GID_DB_USER: ${GID_DB_USER:-gid_user}
      GID_DB_PASSWORD: ${GID_DB_PASSWORD:?Application database password required}
      GID_APP_USER: ${GID_APP_USER:-gid_app}
      GID_APP_PASSWORD: ${GID_APP_PASSWORD:?Application runtime password required}
      GID_DB_SCHEMA: ${GID_DB_SCHEMA:-gid}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-grabitdown_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - staging_net

  redis:
    image: redis:7-alpine
    container_name: mediaforge-staging-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${STAGING_REDIS_PORT:-26380}:6379"
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - staging_net

networks:
  staging_net:
    name: mediaforge_staging_net
    driver: bridge

volumes:
  staging_pgdata:
    name: mediaforge_staging_pgdata
  staging_redis_data:
    name: mediaforge_staging_redis_data
  staging_media_data:
    name: mediaforge_staging_media_data
  staging_api_data:
    name: mediaforge_staging_api_data
  staging_caddy_data:
    name: mediaforge_staging_caddy_data
  staging_caddy_config:
    name: mediaforge_staging_caddy_config
